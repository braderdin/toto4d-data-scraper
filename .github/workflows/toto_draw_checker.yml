name: Toto 4D Draw Checker (Semakan Hadiah Telegram)

on:
  schedule:
    # Berjalan jam 04:00 UTC 12:00 Tengah Hari (MYT) pada hari Ahad, Isnin, Rabu, dan Khamis.
    - cron: '0 4 * * 0,1,3,4'
  workflow_dispatch:

# Kebenaran untuk membolehkan GitHub Action commit balik ke repo
permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # STEP 1: Kemaskini JSON tempatan dengan keputusan cabutan malam ini (Senyap)
      - name: Scrape Data Terkini (Silent Refresh)
        run: |
          python python_script/toto_01_scraper.py

      # STEP 2: Semak nombor taruhan berbanding data[0] & hantar laporan ke Telegram
      - name: Semak Keputusan Cabutan Terkini & Hantar Ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_script/toto_11_draw_checker.py

      # STEP 3: Auto Commit fail JSON jika terdapat cabutan baharu
      - name: Commit & Push Kemaskini Data JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Auto-update toto_4d_results.json via draw checker [skip ci]"
          file_pattern: 'data/output/toto_4d_results.json'