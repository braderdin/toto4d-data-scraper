name: Toto 4D Auto Scraper & Telegram Report

on:
  schedule:
# Isnin, Selasa & Khamis, jam 10:00 Pagi MYT
  - cron: '0 2 * * 1,2,4'

# Sabtu, jam 11:30 Malam MYT
  - cron: '30 15 * * 6'
  
  workflow_dispatch:

# Kebenaran untuk membolehkan GitHub Action commit balik ke repo
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Jalankan Skrip Scraper & Analisis Toto 4D
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_script/toto_main.py

      - name: Jalankan Semakan Gap Analysis Standalone
        run: |
          python python_script/toto_04_gap_analyzer.py

      - name: Jalankan Semakan Hybrid Analysis Standalone
        run: |
          python python_script/toto_05_hybrid_analyzer.py

      - name: Jalankan Semakan Strategy Advisor Standalone
        run: |
          python python_script/toto_06_strategy_advisor.py

      # =========================================================
      # STEP BAHARU: COMMIT & PUSH FAIL JSON KE REPOSITORI
      # =========================================================
      - name: Commit & Push Kemaskini Data JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Auto-update toto_4d_results.json [skip ci]"
          file_pattern: 'data/output/toto_4d_results.json'