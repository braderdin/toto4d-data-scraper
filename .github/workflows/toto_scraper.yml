name: Toto 4D Auto Scraper & Telegram Report

on:
  schedule:
    - cron: '0 0 * * 0,1,4,5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Jalankan Skrip Scraper & Analisis Toto 4D
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_script/toto_main.py

      # =========================================================
      # STEP BAHARU: Semakan Output Berasingan (Gap & Hybrid)
      # =========================================================
      - name: Jalankan Semakan Gap Analysis Standalone
        run: |
          python python_script/toto_04_gap_analyzer.py

      - name: Jalankan Semakan Hybrid Analysis Standalone
        run: |
          python python_script/toto_05_hybrid_analyzer.py

      - name: Simpan Keputusan JSON Sebagai Artifak
        uses: actions/upload-artifact@v7
        with:
          name: toto-4d-results
          path: data/output/toto_4d_results.json
          retention-days: 14