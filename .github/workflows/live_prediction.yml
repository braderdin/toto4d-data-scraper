name: Sports Toto 4D Live Prediction & Notification Pipeline

on:
  schedule:
    # Berjalan jam 6:00 Pagi MYT pada hari cabutan: Selasa (Special), Rabu, Sabtu & Ahad
    # Persamaan UTC: Isnin, Selasa, Jumaat & Sabtu jam 22:00 UTC
    - cron: '0 22 * * 1,2,5,6'
  workflow_dispatch: # Membolehkan trigger manual bila-bila masa dari GitHub UI

permissions:
  contents: write # Diperlukan untuk kebenaran auto-commit & push ke repositori

jobs:
  run-engine:
    name: Run Scraper, Live Engine (5 Formulas) & Telegram Bot
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🕷️ Step 1 - Scrape Toto 4D Results (Latest 2 Weeks)
        run: |
          python python_script/toto_01_scraper.py

      - name: 🧠 Step 2 - Run Formula 18 (Dual-Window Bayesian Momentum)
        run: |
          python live_engine/18_dual_window_bayesian_momentum.py

      - name: ⚙️ Step 3 - Run Formula 20 (Dynamic Regime-Switching Gate)
        run: |
          python live_engine/20_dynamic_regime_switching.py

      - name: ⚡ Step 4 - Run Formula 36 (Tuned Dynamic Exponential Decay Gate)
        run: |
          python live_engine/36_tuned_dynamic_ema_gate.py

      - name: 🚀 Step 5 - Run Formula 37 (Multi-Regime Ensemble & Asymmetric iBox Master)
        run: |
          python new_formula/37_ensemble_multi_regime_ibox.py

      - name: 👑 Step 6 - Run Formula 39 (Ensemble Hybrid Direct & iBox Master)
        run: |
          python new_formula/39_ensemble_multi_regime_hybrid_direct_ibox.py

      - name: 📱 Step 7 - Send Telegram Notifications (5 Messages)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python live_engine/00_telegram.py

      - name: 💾 Step 8 - Auto-commit & Push Updated JSON Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambah fail data terkini dan semua fail cadangan formula (termasuk temp/ Formula 37 & 39)
          git add data/output/toto_4d_results.json live_engine/temp/*.json temp/*.json
          
          # Semak jika ada perubahan fail sebelum commit
          if git diff --staged --quiet; then
            echo "Tiada perubahan fail untuk dicommit."
          else
            git commit -m "🤖 Auto-update Toto 4D results & live predictions (5 Formulas) [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
          fi