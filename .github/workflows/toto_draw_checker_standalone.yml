name: Toto 4D Draw Checker (Semakan Hadiah Telegram)

on:
#  schedule:
    # Berjalan jam 04:00 UTC 12:00 Tengah Hari (MYT) pada hari Ahad, Isnin, Rabu, dan Khamis.
#    - cron: '0 4 * * 0,1,3,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kod Repositori
        uses: actions/checkout@v7

      - name: Pasang Persekitaran Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pasang Pustaka Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # STEP 1: Kemaskini JSON tempatan secara senyap
      - name: Scrape Data Terkini (Silent Refresh)
        run: |
          python python_script/toto_01_scraper.py

      # STEP 2: Jalankan skrip Draw Checker baharu di folder baharu
      - name: Semak Keputusan Cabutan Terkini & Hantar Ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python python_script/draw_checker/toto_standalone_checker.py

      # STEP 3: Auto Commit fail JSON jika ada cabutan baharu
      - name: Commit & Push Kemaskini Data JSON
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chrono: Auto-update toto_4d_results.json via standalone checker [skip ci]"
          file_pattern: 'data/output/toto_4d_results.json'